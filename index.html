<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Loja de Roupas</title>
</head>

<body>

    <h1>Loja de Roupas</h1>

    <h2>Cadastrar produto</h2>

    <input id="nome" placeholder="Nome do produto">
    
<input id="preco" type="number" step="0.01" placeholder="Preço do produto">

<input id="descricao" placeholder="Descrição do produto">
    
    <button onclick="salvar()">
        Salvar
    </button>

    <p id="mensagem"></p>

    <h2>Produtos cadastrados</h2>

    <ul id="lista"></ul>

    <script src="script.js"></script>

</body>

</html>
